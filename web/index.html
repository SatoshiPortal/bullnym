<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="icon" type="image/png" href="/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<title>Point of sale</title>
		<script>
			// A cashier link installs with its own manifest, whose start_url is
			// the link. The service serves the manifests of both kinds of link.
			;(function () {
				var unlisted = location.pathname.match(/^\/c\/([0-9a-fA-F]+)\/?$/)
				var pub = location.pathname.match(/^\/([a-z0-9-]+)\/?$/)
				var link = document.createElement('link')
				link.rel = 'manifest'
				if (unlisted) link.href = '/c/' + unlisted[1] + '/manifest.webmanifest'
				else if (pub) link.href = '/' + pub[1] + '/manifest.webmanifest'
				else link.href = '/manifest.webmanifest'
				document.head.appendChild(link)
			})()
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
